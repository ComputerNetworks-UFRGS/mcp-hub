apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-studio
  namespace: mcp-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-studio
  template:
    metadata:
      labels:
        app: agent-studio
    spec:
      containers:
        - name: agent-studio
          image: rhalexandrini/agent-studio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_URI
              value: "postgresql://studio:$(POSTGRES_PASSWORD)@localhost:5432/agentdb"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-agent-postgres-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: k8s-agent-postgres-credentials
          volumeMounts:
            - name: k8s-agent-postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: k8s-agent-postgres-data
          persistentVolumeClaim:
            claimName: k8s-agent-postgres-data
