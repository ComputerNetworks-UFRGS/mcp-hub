apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: rhalexandrini
---
# ClusterRoleBinding gives the SA read-only access to all namespaces.
# "view" is a built-in ClusterRole: pods, logs, deployments, services,
# configmaps, events — but NOT secrets or RBAC resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: rhalexandrini
