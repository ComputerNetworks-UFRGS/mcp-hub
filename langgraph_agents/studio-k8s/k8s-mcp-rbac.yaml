apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: mcp-hub
---
# Gives the k8s-mcp SA read-only access to its own namespace
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: k8s-mcp-view
#   namespace: mcp-hub
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: view
# subjects:
#   - kind: ServiceAccount
#     name: k8s-mcp
#     namespace: mcp-hub
# ---
# Allows k8s-mcp SA to impersonate ONLY the listed virtual *-readonly users.
# resourceNames must be updated whenever a new user is provisioned.
# Without this restriction the SA could impersonate system:masters or any
# cluster-admin, which would grant full cluster access if the app is compromised.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-impersonator
rules:
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
    resourceNames:
      # Add one entry per user: <keycloak-username>-readonly
      - rhalexandrini-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-impersonator
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: mcp-hub
---
# ── Per-user provisioning (fazer para cada novo usuário) ──────────────────────
#
# 1. Adicionar "<USERNAME>-readonly" em resourceNames no ClusterRole acima:
#    kubectl patch clusterrole k8s-mcp-impersonator --type=json \
#      -p='[{"op":"add","path":"/rules/0/resourceNames/-","value":"<USERNAME>-readonly"}]'
#
# 2. Dar view no namespace do usuário:
#    kubectl create rolebinding <USERNAME>-readonly \
#      --clusterrole=view \
#      --user=<USERNAME>-readonly \
#      -n <NAMESPACE>
#
# 3. Criar o usuário no Keycloak e adicioná-lo ao grupo k8s-agent-users.
